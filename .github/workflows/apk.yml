name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: unzip -q pet-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar
        run: gradle -p pet-android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pet-apk
          path: pet-android/app/build/outputs/apk/debug/app-debug.apk
