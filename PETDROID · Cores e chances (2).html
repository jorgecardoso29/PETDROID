<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PETDROID · Cores</title>
<style>
:root{--bg:#0b100d;--cartao:#141b17;--borda:#25362b;--destaque:#63e56f;--texto:#d6f5df;--suave:#8aa595;color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px 32px}
h1{margin:0;text-align:center;font-size:30px;letter-spacing:.12em;color:var(--destaque)}
.sub{text-align:center;color:var(--suave);font-size:13px;margin:4px 0 8px}
h2{font-size:16px;margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--suave);font-weight:400;font-size:12px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{background:var(--cartao);border:1px solid var(--borda);border-radius:18px;padding:8px 8px 12px;text-align:center}
.c canvas{width:160px;height:132px;max-width:100%}
.n{font-size:14px;font-weight:700}.n i{font-style:normal;color:var(--suave);font-weight:400;margin-right:4px}
.p{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--borda);font-size:12px;color:var(--suave)}
.p b{color:var(--texto)}
.nota{color:var(--suave);font-size:11px;text-align:center;margin-top:22px}
</style>
</head>
<body>
<h1>PETDROID</h1>
<div class="sub">cores dos pets e chance de drop</div>
<div id="app"></div>
<div class="nota">As chances ficam no campo “chance” de cada cor, no código desta página.</div>
<script>
// [nome, moldura, olho, brilho, chance %, efeito]
const COMUNS=[["Verde-esmeralda","#63e56f","#3ee877","#c8ffd8"],["Verde-limão","#b5ff2e","#c6ff4d","#f2ffd0"],["Azul-ciano","#2ee6e6","#4df0f0","#d0ffff"],["Azul-elétrico","#2f7bff","#4d95ff","#d6e6ff"],["Azul-marinho","#2a4fb8","#4d74e0","#c9d6ff"],["Roxo","#8b3dff","#a368ff","#e6d6ff"],["Lilás","#c9a0ff","#d7b8ff","#f3e9ff"],["Rosa","#ff8ac4","#ff9fd0","#ffe0f0"],["Magenta","#ff2bd6","#ff55e0","#ffd0f7"],["Vermelho","#ff3b3b","#ff5c5c","#ffd6d6"],["Laranja","#ff8a1f","#ffa04d","#ffe3c7"],["Amarelo","#ffe63b","#fff066","#fffbd0"],["Dourado","#e6b422","#f2c94c","#fff1c2"],["Branco","#f2f2f2","#ffffff","#c9d3ce"],["Preto","#4a4a4a","#9a9a9a","#e8e8e8"]].map(a=>[...a,6.4,""]);
const RARAS=[["Ouro metálico","#e6b422","#e6b422","#ffffff",1.2,"metal"],["Ciano cristal","#29d9e6","#29d9e6","#ffffff",1.0,"cristal"],["Roxo elétrico","#8b3dff","#9b5cff","#e3c8ff",0.8,"raio"],["Fogo","#ff6a1a","#ff6a1a","#fff3b0",0.5,"fogo"],["Verde elétrico","#6bff1f","#6bff1f","#e4ffb8",0.5,"veio"]];
const TODAS=[...COMUNS,...RARAS].map((a,i)=>({i:i+1,nome:a[0],m:a[1],o:a[2],l:a[3],chance:a[4],fx:a[5]}));
const pct=n=>n.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
const soma=l=>l.reduce((s,p)=>s+p.chance,0);

const app=document.getElementById("app"),DPR=window.devicePixelRatio||1;
function secao(titulo,lista){
  const h=document.createElement("h2");h.innerHTML=titulo+"<small>"+pct(soma(lista))+" no total</small>";app.appendChild(h);
  const g=document.createElement("div");g.className="grade";app.appendChild(g);
  for(const p of lista){
    const d=document.createElement("div");d.className="c";
    const cv=document.createElement("canvas");cv.width=160*DPR;cv.height=132*DPR;
    d.appendChild(cv);
    d.insertAdjacentHTML("beforeend",`<div class="n"><i>${p.i}</i>${p.nome}</div><div class="p"><b>${pct(p.chance)}</b> · 1 em ${Math.round(100/p.chance)}</div>`);
    g.appendChild(d);p.c=cv.getContext("2d");p.c.setTransform(DPR,0,0,DPR,0,0);
  }
}
secao("Comuns",TODAS.filter(p=>!p.fx));
secao("Raras",TODAS.filter(p=>p.fx));

const rr=(c,x,y,w,h,r)=>{c.beginPath();c.roundRect(x,y,w,h,r)};
const cl=v=>Math.max(0,Math.min(1,v));
function est(c,p,t,x0,y0,x1,y1,base){
  const f=p.fx;
  if(f==="metal"||f==="cristal"){
    const g=c.createLinearGradient(x0,y0,x1,y1),q=(t*.35)%1.4-.2;
    const L=f==="metal"?["#8a5a0a","#e6b422","#fff3b0"]:["#0fa6b8","#29d9e6","#ffffff"];
    g.addColorStop(0,L[0]);g.addColorStop(cl(q-.2),L[1]);g.addColorStop(cl(q),L[2]);g.addColorStop(cl(q+.2),L[1]);g.addColorStop(1,L[0]);return g;
  }
  if(f==="fogo"){
    const g=c.createLinearGradient(0,y1,0,y0),w=.5+.15*Math.sin(t*7)+.05*Math.sin(t*13);
    g.addColorStop(0,"#e8340c");g.addColorStop(cl(w*.7),"#ff8a1f");g.addColorStop(cl(w+.25),"#ffd23c");g.addColorStop(1,"#ff5a14");return g;
  }
  return base;
}
function zap(c,p,t,x0,y0,x1,y1,n,cor,lw){
  let s=Math.floor(t*9)*97+p.i*31+1;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  c.save();c.strokeStyle=cor;c.lineWidth=lw;c.lineJoin="round";
  for(let k=0;k<n;k++){let x=x0+r()*(x1-x0),y=y0+r()*(y1-y0);c.beginPath();c.moveTo(x,y);
    for(let j=0;j<5;j++){x+=(r()-.5)*16;y+=(r()-.5)*16;c.lineTo(x,y)}c.stroke()}
  c.restore();
}
function desenha(p,t){
  const c=p.c,ph=p.i*1.7,el=p.fx==="raio"||p.fx==="veio";
  c.clearRect(0,0,160,132);c.save();c.translate(80,76);
  c.shadowColor=p.m;c.shadowBlur=p.fx?20:7;
  c.fillStyle="#101512";rr(c,-60,-45,120,90,20);c.fill();
  c.lineWidth=5;c.strokeStyle=est(c,p,t,-60,-45,60,45,p.m);rr(c,-60,-45,120,90,20);c.stroke();
  c.shadowBlur=0;c.fillStyle="#171e19";rr(c,-49,-34,98,68,12);c.fill();
  if(el){c.save();c.beginPath();c.roundRect(-62.5,-47.5,125,95,22);c.roundRect(-57.5,-42.5,115,85,17);c.clip("evenodd");
    zap(c,p,t,-60,-45,60,45,10,p.l,1.3);c.restore()}
  if(p.fx==="fogo")for(let k=0;k<9;k++){
    const x=-52+k*13,v=((t*26+k*37)%26)/26,y=-47-v*22,r=5*(1-v);
    c.fillStyle=`rgba(255,${120+v*100|0},30,${.85*(1-v)})`;c.beginPath();
    c.ellipse(x+Math.sin(t*6+k)*2,y,r*.7,r*1.5,0,0,7);c.fill();
  }
  const gx=Math.sin(t*.9+ph)*.9,gy=Math.sin(t*1.3+ph*2)*.6,u=(t+ph)%3.4,b=u<.16?Math.abs(u/.08-1):1;
  for(const s of[-1,1]){
    const w=22,h=Math.max(3,30*b),cx=s*24+gx*4,cy=gy*3,top=cy-h/2;
    c.save();rr(c,cx-w/2,top,w,h,Math.min(w,h)*.38);
    c.fillStyle=est(c,p,t,cx-w/2,top,cx+w/2,top+h,p.o);c.shadowColor=p.o;c.shadowBlur=p.fx?8:0;c.fill();c.shadowBlur=0;
    if(el){c.clip();zap(c,p,t+.3,cx-w/2,top,cx+w/2,top+h,3,p.l,1)}
    c.restore();
    if(b>.5){c.fillStyle=p.l;c.beginPath();c.arc(cx-w*.18+gx*3,top+h*.24+gy*2,3.6,0,7);c.fill()}
  }
  c.restore();
}
function quadro(ms){const t=ms/1000;for(const p of TODAS)desenha(p,t);requestAnimationFrame(quadro)}
requestAnimationFrame(quadro);
</script>
</body>
</html>
